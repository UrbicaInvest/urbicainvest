<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urbica Invest - Inversión inmobiliaria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(26, 35, 126, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(49, 27, 146, 0.15) 0%, transparent 50%);
            animation: gradient 15s ease infinite;
        }
        
        @keyframes gradient {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, -50px); }
        }
        
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 3rem 2rem;
            max-width: 700px;
        }
        
        .logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 3rem;
            letter-spacing: -0.01em;
            color: #e0e0e0;
        }
        
        .description {
            font-size: 1.125rem;
            font-weight: 300;
            color: #a0a0a0;
            line-height: 1.8;
            margin-bottom: 3.5rem;
        }
        
        .contact-box {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 1.75rem;
            border-radius: 12px;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }
        
        .contact-box:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .contact-box svg {
            width: 20px;
            height: 20px;
            opacity: 0.6;
        }
        
        .email a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: -0.01em;
        }
        
        @media (max-width: 768px) {
            .logo { font-size: 1.5rem; margin-bottom: 2rem; }
            h1 { font-size: 1.25rem; margin-bottom: 2rem; }
            .description { font-size: 1rem; margin-bottom: 2.5rem; }
            .container { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">URBICA INVEST</div>
        
        <h1>Inversión inmobiliaria — Costa del Sol</h1>
        
        <p class="description">
            Rehabilitación y alquiler vacacional.
            Adquisición y coinversión selectiva de activos con potencial<br>
        </p>
        
        <div class="contact-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
            </svg>
            <span class="email"><a href="mailto:info@urbicainvest.com">info@urbicainvest.com</a></span>
        </div>
    </div>
</body>
</html>
